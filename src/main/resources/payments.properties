# UcoPet - Procesador de Pagos: comunicacion con RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Si un consumidor lanza una excepcion, el mensaje se descarta en vez de
# reencolarse. Sin esto, un mensaje invalido se reintenta en bucle infinito.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Facturas ---
ucopet.payment.invoice.create.exchange=ucopet.payment.invoice.create.exchange
ucopet.payment.invoice.create.queue=ucopet.payment.invoice.create.queue
ucopet.payment.invoice.create.routing-key=ucopet.payment.invoice.create.rk

ucopet.payment.invoice.payment.exchange=ucopet.payment.invoice.payment.exchange
ucopet.payment.invoice.payment.queue=ucopet.payment.invoice.payment.queue
ucopet.payment.invoice.payment.routing-key=ucopet.payment.invoice.payment.rk

ucopet.payment.invoice.cancel.exchange=ucopet.payment.invoice.cancel.exchange
ucopet.payment.invoice.cancel.queue=ucopet.payment.invoice.cancel.queue
ucopet.payment.invoice.cancel.routing-key=ucopet.payment.invoice.cancel.rk


# --- Recibos de caja ---
ucopet.payment.receipt.create.exchange=ucopet.payment.receipt.create.exchange
ucopet.payment.receipt.create.queue=ucopet.payment.receipt.create.queue
ucopet.payment.receipt.create.routing-key=ucopet.payment.receipt.create.rk

ucopet.payment.receipt.update.exchange=ucopet.payment.receipt.update.exchange
ucopet.payment.receipt.update.queue=ucopet.payment.receipt.update.queue
ucopet.payment.receipt.update.routing-key=ucopet.payment.receipt.update.rk

ucopet.payment.receipt.cancel.exchange=ucopet.payment.receipt.cancel.exchange
ucopet.payment.receipt.cancel.queue=ucopet.payment.receipt.cancel.queue
ucopet.payment.receipt.cancel.routing-key=ucopet.payment.receipt.cancel.rk

# --- Egresos ---
# crear y actualizar
payments.egress.save.exchange-name=ucopet.payment.egress.save.ex
payments.egress.save.queue-name=ucopet.payment.egress.save.qu
payments.egress.save.routing-key-name=ucopet.payment.egress.save.rk
# eliminar
payments.egress.delete.exchange-name=ucopet.payment.egress.delete.ex
payments.egress.delete.queue-name=ucopet.payment.egress.delete.qu
payments.egress.delete.routing-key-name=ucopet.payment.egress.delete.rk