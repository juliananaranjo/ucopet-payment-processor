# UcoPet - Procesador de Pagos: comunicacion con RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Si un consumidor lanza una excepcion, el mensaje se descarta en vez de
# reencolarse. Sin esto, un mensaje invalido se reintenta en bucle infinito.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

ucopet.payment.exchange=ucopet.payment.exchange

# --- Facturas ---
ucopet.payment.bindings.invoice-create.queue=ucopet.payment.invoice.create.queue
ucopet.payment.bindings.invoice-create.routing-key=ucopet.payment.invoice.create
ucopet.payment.bindings.invoice-payment.queue=ucopet.payment.invoice.payment.queue
ucopet.payment.bindings.invoice-payment.routing-key=ucopet.payment.invoice.payment
ucopet.payment.bindings.invoice-cancel.queue=ucopet.payment.invoice.cancel.queue
ucopet.payment.bindings.invoice-cancel.routing-key=ucopet.payment.invoice.cancel

# --- Recibos de caja ---
ucopet.payment.receipt.create.exchange=ucopet.payment.receipt.create.exchange
ucopet.payment.receipt.create.queue=ucopet.payment.receipt.create.queue
ucopet.payment.receipt.create.routing-key=ucopet.payment.receipt.create.rk

ucopet.payment.receipt.update.exchange=ucopet.payment.receipt.update.exchange
ucopet.payment.receipt.update.queue=ucopet.payment.receipt.update.queue
ucopet.payment.receipt.update.routing-key=ucopet.payment.receipt.update.rk

ucopet.payment.receipt.cancel.exchange=ucopet.payment.receipt.cancel.exchange
ucopet.payment.receipt.cancel.queue=ucopet.payment.receipt.cancel.queue
ucopet.payment.receipt.cancel.routing-key=ucopet.payment.receipt.cancel.rk

# --- Egresos ---
ucopet.payment.bindings.egress-create.queue=ucopet.payment.egress.create.queue
ucopet.payment.bindings.egress-create.routing-key=ucopet.payment.egress.create
ucopet.payment.bindings.egress-update.queue=ucopet.payment.egress.update.queue
ucopet.payment.bindings.egress-update.routing-key=ucopet.payment.egress.update
ucopet.payment.bindings.egress-delete.queue=ucopet.payment.egress.delete.queue
ucopet.payment.bindings.egress-delete.routing-key=ucopet.payment.egress.delete