spring.application.name=ucopet-payment-processor
spring.config.import=classpath:payments.properties
server.port=8083
# Procesador "headless": no levanta servidor HTTP, solo escucha colas.
spring.main.web-application-type=none

# Misma base de datos que la API (ver docker-compose.yml de ucopetapi).
spring.datasource.url=jdbc:postgresql://localhost:5432/ucopetdb
spring.datasource.username=postgres
spring.datasource.password=11ospinarroyave
spring.datasource.driver-class-name=org.postgresql.Driver

# La API es la duena del esquema (ddl-auto=update alla). El procesador solo
# verifica al arrancar que sus entidades coincidan con las tablas existentes.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false