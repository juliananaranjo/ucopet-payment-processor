plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.uco'
version = '0.0.1-SNAPSHOT'
description = 'Payment processor for UcoPet (Recibos de caja, Egresos y Facturas)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// RabbitMQ: consumidores (@RabbitListener)
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	// JSON (Jackson 3): convertir los mensajes de texto a DTOs
	implementation 'org.springframework.boot:spring-boot-starter-json'
	// Persistencia: la misma base de datos PostgreSQL que usa la API
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}